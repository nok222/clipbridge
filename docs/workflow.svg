<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Phone Gradient -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Server Gradient -->
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- PC Gradient -->
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
    .flow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
    .sub-flow { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; }
  </style>

  <!-- Background Canvas -->
  <rect width="880" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Network Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="70" x2="880" y2="70" />
    <line x1="0" y1="140" x2="880" y2="140" />
    <line x1="0" y1="210" x2="880" y2="210" />
    <line x1="146" y1="0" x2="146" y2="280" />
    <line x1="292" y1="0" x2="292" y2="280" />
    <line x1="440" y1="0" x2="440" y2="280" />
    <line x1="586" y1="0" x2="586" y2="280" />
    <line x1="732" y1="0" x2="732" y2="280" />
  </g>

  <!-- ================= STEP 1: iOS DEVICE ================= -->
  <g transform="translate(45, 45)" filter="url(#shadow)">
    <rect width="190" height="190" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="url(#phoneGrad)"/>
    <!-- Phone Icon -->
    <path d="M30 25 C27.5 25 25.5 27 25.5 29.5 L25.5 40.5 C25.5 43 27.5 45 30 45 L39.5 45 C42 45 44 43 44 40.5 L44 29.5 C44 27 42 25 39.5 25 Z M35 43 C34.2 43 33.5 42.3 33.5 41.5 C33.5 40.7 34.2 40 35 40 C35.8 40 36.5 40.7 36.5 41.5 C36.5 42.3 35.8 43 35 43 Z" fill="#ffffff"/>
    
    <text x="15" y="80" class="title">iOS Device</text>
    <text x="15" y="100" class="subtitle">iPhone / iPad</text>

    <!-- Badge -->
    <rect x="15" y="125" width="160" height="28" rx="6" fill="#0284c7" opacity="0.2"/>
    <text x="25" y="143" class="badge" fill="#38bdf8">⚡ Action / Back Tap</text>
    <text x="15" y="175" class="sub-flow">Trigger "Send to PC" shortcut</text>
  </g>

  <!-- Connection: iOS to Server -->
  <g>
    <path d="M 235 140 L 335 140" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
    <rect x="245" y="112" width="80" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="285" y="126" text-anchor="middle" class="flow-label">POST JSON</text>
    <text x="285" y="156" text-anchor="middle" class="sub-flow">Port 8765</text>
  </g>

  <!-- ================= STEP 2: CP-SERVER ================= -->
  <g transform="translate(345, 45)" filter="url(#shadow)">
    <rect width="200" height="190" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="url(#serverGrad)"/>
    <!-- Server / Tray Icon -->
    <path d="M26 27 L44 27 C45 27 46 28 46 29 L46 32 C46 33 45 34 44 34 L26 34 C25 34 24 33 24 32 L24 29 C24 28 25 27 26 27 Z M26 37 L44 37 C45 37 46 38 46 39 L46 42 C46 43 45 44 44 44 L26 44 C25 44 24 43 24 42 L24 39 C24 38 25 37 26 37 Z" fill="#ffffff"/>
    <circle cx="41" cy="30.5" r="1.5" fill="#a7f3d0"/>
    <circle cx="41" cy="40.5" r="1.5" fill="#a7f3d0"/>

    <text x="15" y="80" class="title">cp-server (Go)</text>
    <text x="15" y="100" class="subtitle">Background System Tray</text>

    <!-- Badge -->
    <rect x="15" y="125" width="170" height="28" rx="6" fill="#059669" opacity="0.2"/>
    <text x="25" y="143" class="badge" fill="#34d399">🛡️ Local Wi-Fi (LAN)</text>
    <text x="15" y="175" class="sub-flow">Low memory (~10MB), Silent</text>
  </g>

  <!-- Connection: Server to Clipboard -->
  <g>
    <path d="M 545 140 L 635 140" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <rect x="553" y="112" width="75" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="590" y="126" text-anchor="middle" class="flow-label" fill="#10b981">WinAPI</text>
    <text x="590" y="156" text-anchor="middle" class="sub-flow">SetClipboard</text>
  </g>

  <!-- ================= STEP 3: WINDOWS PC ================= -->
  <g transform="translate(645, 45)" filter="url(#shadow)">
    <rect width="190" height="190" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="10" fill="url(#pcGrad)"/>
    <!-- PC Screen / Keyboard Icon -->
    <path d="M25 26 L45 26 C46 26 47 27 47 28 L47 38 C47 39 46 40 45 40 L25 40 C24 40 23 39 23 38 L23 28 C23 27 24 26 25 26 Z M32 41 L38 41 L40 44 L30 44 Z" fill="#ffffff"/>

    <text x="15" y="80" class="title">Windows PC</text>
    <text x="15" y="100" class="subtitle">System Clipboard</text>

    <!-- Badge -->
    <rect x="15" y="125" width="160" height="28" rx="6" fill="#4f46e5" opacity="0.2"/>
    <text x="25" y="143" class="badge" fill="#a5b4fc">⌨️ Ctrl + V Instantly</text>
    <text x="15" y="175" class="sub-flow">Ready to paste anywhere</text>
  </g>
</svg>

